[package]
name = "pocket-tts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance CPU-based Text-to-Speech library using Candle"
keywords.workspace = true
categories.workspace = true

[features]
default = []
mkl = ["dep:intel-mkl-src", "candle-core/mkl", "candle-nn/mkl"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
# Kept so `--features quantized` keeps building; quantization is always on.
quantized = []

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
safetensors.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
byteorder.workspace = true
lenient_semver = "0.4.2"
rubato = "0.14.1"
regex = "1"
hound.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon = "1.11.0"
tracing.workspace = true
hf-hub.workspace = true
memmap2.workspace = true
tokenizers = { workspace = true, features = ["onig", "progressbar", "http"] }
intel-mkl-src = { workspace = true, optional = true }
tn = { git = "https://github.com/rzafiamy/tn-rs", tag = "v0.1.0" }

[[bench]]
name = "streaming_bench"
harness = false

[dev-dependencies]
criterion = "0.8.1"
candle-core.workspace = true
anyhow.workspace = true
[[bench]]
name = "full_benchmark"
harness = false

[[bench]]
name = "attention_bench"
harness = false

[[bench]]
name = "voice_state_bench"
harness = false
