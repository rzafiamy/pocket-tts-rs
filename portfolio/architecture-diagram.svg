<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="130" y1="80" x2="170" y2="80"/>
    <line x1="320" y1="80" x2="360" y2="80"/>
    <line x1="520" y1="80" x2="560" y2="80"/>
    <line x1="720" y1="80" x2="760" y2="80"/>
    <line x1="440" y1="210" x2="440" y2="112"/>
    <path d="M640 112 C 640 150, 470 150, 455 112"/>
  </g>
  <g stroke="#333" stroke-width="1.2">
    <rect x="20" y="50" width="110" height="60" rx="8" fill="#eef3fb"/>
